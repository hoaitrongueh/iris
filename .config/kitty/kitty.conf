background #101010
foreground #dddddd
background_opacity 0.57
dynamic_background_opacity yes
selection_background #cccccc
selection_foreground #101010
cursor #eeeeee
cursor_text_color #101010
url_color #bbbbbb
active_border_color #858585
inactive_border_color #444444
color0 #161616
color1 #a0a0a0
color2 #b0b0b0
color3 #c0c0c0
color4 #a8a8a8
color5 #b8b8b8
color6 #c8c8c8
color7 #dddddd
color8 #606060
color9 #b8b8b8
color10 #c8c8c8
color11 #d8d8d8
color12 #c0c0c0
color13 #d0d0d0
color14 #e0e0e0
color15 #f0f0f0
active_tab_background #dddddd
active_tab_foreground #101010
inactive_tab_background #202020
inactive_tab_foreground #aaaaaa

font_family CaskaydiaCove Nerd Font
font_size 11.5
window_padding_width 9
scrollback_lines 10000
wheel_scroll_multiplier 3
enable_audio_bell no
copy_on_select no
confirm_os_window_close 0
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+f show_scrollback

map ctrl+shift+f5 load_config_file

cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval 0
tab_bar_style separator
tab_separator "  │  "
